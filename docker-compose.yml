version: "3.9"

services:
  track-a-control-loop:
    build: ./track-a
    image: track-a-control-loop:latest
    container_name: track-a-control-loop
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RAG_CORPUS_PATH=/rag/docs
      - POLICY_DIR=/policy
      - LEDGER_PATH=/var/log/ledger
      - TRACK_B_URL=http://track-b-actuator:8081
    volumes:
      - ./rag:/rag/docs:ro
      - ./policy:/policy:ro
      - ledger-a:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      track-b-actuator:
        condition: service_healthy

  track-b-actuator:
    build: ./track-b
    image: track-b-actuator:latest
    container_name: track-b-actuator
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - TOOL_ALLOWLIST=/policy/tool-allowlist.txt
      - LEDGER_PATH=/var/log/ledger
      - TRACK_A_URL=http://track-a-control-loop:8080
    volumes:
      - ./policy:/policy:ro
      - ledger-b:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sheryl:
    build:
      context: .
      dockerfile: ./executive-quartet/sheryl/Dockerfile
    image: sheryl:latest
    container_name: sheryl
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - MEMORYPLUGIN_API_KEY
      - LEDGER_PATH=/var/log/ledger
    volumes:
      - ledger-sheryl:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  aura-agent:
    build:
      context: .
      dockerfile: ./executive-quartet/aura/Dockerfile
    image: aura-agent:latest
    container_name: aura-agent
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - LEDGER_PATH=/var/log/ledger
    volumes:
      - ledger-aura:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  malory:
    build: ./executive-quartet/malory
    image: malory:latest
    container_name: malory
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - LEDGER_PATH=/var/log/ledger
    volumes:
      - ledger-malory:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  krieger:
    build: ./executive-quartet/krieger
    image: krieger:latest
    container_name: krieger
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - LEDGER_PATH=/var/log/ledger
    volumes:
      - ledger-krieger:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  self-remediation:
    build: ./self-remediation
    image: self-remediation:latest
    container_name: self-remediation
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - LEDGER_PATH=/var/log/ledger
    volumes:
      - ledger-self-remediation:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  telegram-bridge:
    build: ./telegram-bridge
    image: telegram-bridge:latest
    container_name: telegram-bridge
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - TELEGRAM_BOT_TOKEN
      - LEDGER_PATH=/var/log/ledger
    volumes:
      - ledger-telegram-bridge:/var/log/ledger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ledger-a:
  ledger-b:
  ledger-sheryl:
  ledger-aura:
  ledger-malory:
  ledger-krieger:
  ledger-self-remediation:
  ledger-telegram-bridge:

