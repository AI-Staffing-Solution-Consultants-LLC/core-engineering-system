          --ingress=internal \
          --port=8084
        echo "[+] Aura deployed."

        echo "[*] Deploying Malory to Cloud Run..."
        gcloud run deploy ${_SERVICE_MALORY} \
          --image=${_REPO}/${_SERVICE_MALORY}:${SHORT_SHA} \
          --region=${_REGION} \
          --project=${_PROJECT} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=1 \
          --ingress=internal \
          --port=8085
        echo "[+] Malory deployed."

        echo "[*] Deploying Krieger to Cloud Run..."
        gcloud run deploy ${_SERVICE_KRIEGER} \
