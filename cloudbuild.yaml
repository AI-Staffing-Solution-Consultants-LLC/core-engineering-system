          self-remediation
        docker push ${_REPO}/${_SERVICE_REMEDIATION}:latest
        echo "[+] Self-Remediation Engine build and push complete."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 12: Build Barry Preservation (DO-Lobe Migration)
  # Builds the preservation/manifest image — NO Cloud Run deployment.
  # Barry is a DigitalOcean → target-platform migration artifact stored
  # as a reproducible container image.
  # Only builds if barry-preservation/ files changed.
  # ────────────────────────────────────────────────────────────────────────────
  - id: 'build-barry-preservation'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . /workspace/build_flags.env
        if [ "$${BUILD_BARRY:-false}" != "true" ]; then
          echo "[*] Skipping Barry Preservation build (no changes in barry-preservation/)."
          exit 0
        fi
        echo "[*] Building Barry Preservation (DO-Lobe Migration)..."
        docker build \
          -f barry-preservation/Dockerfile \
          -t ${_REPO}/${_SERVICE_BARRY}:latest \
          barry-preservation
        docker push ${_REPO}/${_SERVICE_BARRY}:latest
        echo "[+] Barry Preservation build and push complete."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 13: Deploy Executive Quartet to Cloud Run
  # Deploys all four executive agents with constitutional AI enforcement.
  # Ports: sheryl=8083, aura=8084, malory=8085, krieger=8086.
  # ────────────────────────────────────────────────────────────────────────────
  - id: 'deploy-quartet'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        . /workspace/build_flags.env
        if [ "$${BUILD_QUARTET:-false}" != "true" ]; then
          echo "[*] Skipping Executive Quartet deploy (no changes in executive-quartet/)."
          exit 0
        fi
        echo "[*] Deploying Sheryl to Cloud Run..."
        gcloud run deploy ${_SERVICE_SHERYL} \
          --image=${_REPO}/${_SERVICE_SHERYL}:latest \
          --region=${_REGION} \
          --project=${_PROJECT} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=1 \
          --ingress=internal \
          --port=8083
        echo "[+] Sheryl deployed."

        echo "[*] Deploying Aura to Cloud Run..."
        gcloud run deploy ${_SERVICE_AURA} \
          --image=${_REPO}/${_SERVICE_AURA}:latest \
          --region=${_REGION} \
          --project=${_PROJECT} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=1 \
          --ingress=internal \
          --port=8084
        echo "[+] Aura deployed."

        echo "[*] Deploying Malory to Cloud Run..."
        gcloud run deploy ${_SERVICE_MALORY} \
          --image=${_REPO}/${_SERVICE_MALORY}:latest \
          --region=${_REGION} \
          --project=${_PROJECT} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=1 \
          --ingress=internal \
          --port=8085
        echo "[+] Malory deployed."

        echo "[*] Deploying Krieger to Cloud Run..."
        gcloud run deploy ${_SERVICE_KRIEGER} \
          --image=${_REPO}/${_SERVICE_KRIEGER}:latest \
          --region=${_REGION} \
          --project=${_PROJECT} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=1 \
          --ingress=internal \
          --port=8086
        echo "[+] Krieger deployed."
        echo "[+] Executive Quartet deployed (all 4 agents)."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 14: Deploy Telegram Bridge to Cloud Run
  # ────────────────────────────────────────────────────────────────────────────
  - id: 'deploy-telegram'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        . /workspace/build_flags.env
        if [ "$${BUILD_TELEGRAM:-false}" != "true" ]; then
          echo "[*] Skipping Telegram Bridge deploy (no changes in telegram-bridge/)."
          exit 0
        fi
        echo "[*] Deploying Telegram Bridge to Cloud Run..."
        gcloud run deploy ${_SERVICE_TELEGRAM} \
          --image=${_REPO}/${_SERVICE_TELEGRAM}:latest \
          --region=${_REGION} \
          --project=${_PROJECT} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=1 \
          --ingress=internal \
          --port=8088
        echo "[+] Telegram Bridge deployed."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 15: Deploy Self-Remediation Engine to Cloud Run
  # ────────────────────────────────────────────────────────────────────────────
  - id: 'deploy-remediation'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        . /workspace/build_flags.env
        if [ "$${BUILD_REMEDIATION:-false}" != "true" ]; then
          echo "[*] Skipping Self-Remediation deploy (no changes in self-remediation/)."
          exit 0
        fi
        echo "[*] Deploying Self-Remediation Engine to Cloud Run..."
        gcloud run deploy ${_SERVICE_REMEDIATION} \
          --image=${_REPO}/${_SERVICE_REMEDIATION}:latest \
          --region=${_REGION} \
          --project=${_PROJECT} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=1 \
          --ingress=internal \
          --port=8087
        echo "[+] Self-Remediation Engine deployed."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 16: Deploy Cloudflare inference-router Worker
  # Only deploys if cloudflare/workers/inference-router/ files changed.
  # Uses Infisical-seeded secrets from /workspace/inference_secrets.env.
  # wrangler MUST be installed: npm install -g wrangler or use a prebuilt image.
  # ────────────────────────────────────────────────────────────────────────────
  - id: 'deploy-cloudflare-inference-router'
    name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eu
        . /workspace/build_flags.env 2>/dev/null || { echo "[!] build_flags.env not found"; exit 0; }

        if [ "$${BUILD_CLOUDFLARE:-false}" != "true" ]; then
          echo "[*] Skipping Cloudflare Worker deploy (no changes in cloudflare/)."
          exit 0
        fi

        # Check if inference-router specifically changed
        CHANGED_FILES=$$(git diff --name-only "$${_BASE_SHA:-HEAD~1}" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        if ! echo "$$CHANGED_FILES" | grep -q "cloudflare/workers/inference-router/"; then
          echo "[*] Skipping inference-router deploy (worker files unchanged)."
          exit 0
        fi

        echo "[*] Deploying Cloudflare inference-router Worker..."
        cd /workspace/cloudflare/workers/inference-router

        # Install wrangler
        npm install wrangler 2>/dev/null || npm install -g wrangler 2>/dev/null || {
          echo "[-] Failed to install wrangler."
          exit 1
        }

        # Load secrets from Infisical-sourced env file (Step 0 output)
        if [ -f /workspace/inference_secrets.env ]; then
          set -a
          source /workspace/inference_secrets.env
          set +a
          echo "[+] Loaded inference secrets from Infisical."
        else
          echo "[!] WARNING: /workspace/inference_secrets.env not found."
          echo "[!] Secrets must already be set via wrangler secret put."
        fi

        # Push secrets to Worker (only if newly sourced from Infisical)
        if [ -n "$${OPENROUTER_API_KEY:-}" ]; then
          echo "$$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          echo "[+] OPENROUTER_API_KEY updated."
        fi
        if [ -n "$${GCLOUD_ACCESS_TOKEN:-}" ]; then
          echo "$$GCLOUD_ACCESS_TOKEN" | npx wrangler secret put GCLOUD_ACCESS_TOKEN
          echo "[+] GCLOUD_ACCESS_TOKEN updated."
        fi

        # Deploy the Worker
        npx wrangler deploy
        echo "[+] inference-router Worker deployed successfully."


# ──────────────────────────────────────────────────────────────────────────────
# Timeout: 20 minutes (allows for Inference-Tokenomics boot + downstream builds)
# ──────────────────────────────────────────────────────────────────────────────
timeout: 1200s
