        echo "[+] Executive Quartet deployed (all 4 agents)."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 14: Deploy Telegram Bridge to Cloud Run
  # ────────────────────────────────────────────────────────────────────────────
  - id: 'deploy-telegram'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/build_flags.env
        if [[ "$${BUILD_TELEGRAM:-false}" != "true" ]]; then
          echo "[*] Skipping Telegram Bridge deploy (no changes in telegram-bridge/)."
